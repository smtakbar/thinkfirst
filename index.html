<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Think First: Data Structures practice</title>
<meta name="description" content="Data Structures practice where you commit an answer before any hint or solution opens.">
<meta name="theme-color" content="#e9edf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#22252b" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light dark;
  --bg:#e9edf2; --ink:#1d1d1f; --muted:#5c6370;
  --sd:rgba(160,172,190,.6); --sl:rgba(255,255,255,.95);
  --accent:#0064d2; --accent-ink:#ffffff;
  --good:#177332; --bad:#b3261e; --warn:#7a5200;
  --up:7px 7px 16px var(--sd),-7px -7px 16px var(--sl);
  --up-sm:4px 4px 9px var(--sd),-4px -4px 9px var(--sl);
  --in:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--sl);
  --in-sm:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#22252b; --ink:#f2f3f5; --muted:#a2a9b4;
    --sd:rgba(0,0,0,.55); --sl:rgba(255,255,255,.06);
    --accent:#5aa9ff; --accent-ink:#06213f;
    --good:#6fd08c; --bad:#ff9d8f; --warn:#f0cf7a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:22px 20px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:36px}
.brand{font:inherit;font-weight:700;font-size:1.1rem;letter-spacing:-.02em;background:none;border:0;color:var(--ink);padding:6px 2px;cursor:pointer;border-radius:8px}
.brand span{color:var(--accent)}
nav{display:flex;gap:2px;padding:4px;border-radius:99px;box-shadow:var(--in-sm)}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:.86rem;font-weight:500;padding:7px 12px;cursor:pointer;border-radius:99px;transition:color .2s,box-shadow .2s}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--accent);box-shadow:var(--up-sm);font-weight:600}
main:focus{outline:none}
h1{font-size:clamp(2rem,7vw,2.9rem);line-height:1.07;letter-spacing:-.035em;font-weight:700;margin:0 0 .4em;text-wrap:balance}
h2{font-size:1.2rem;letter-spacing:-.02em;font-weight:650;margin:2.4em 0 .8em}
p{margin:.5em 0}
a{color:var(--accent)}
.lead{color:var(--muted);font-size:1.08rem;line-height:1.5;max-width:56ch}
.card{background:var(--bg);border:0;border-radius:24px;padding:24px;box-shadow:var(--up)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;margin-top:6px}
.topic{text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:138px;padding:20px;transition:box-shadow .2s,transform .2s}
.topic:hover{transform:translateY(-2px)}
.topic:active{box-shadow:var(--in);transform:none}
.topic b{font-size:1.05rem;letter-spacing:-.015em;font-weight:650}
.topic small{color:var(--muted);line-height:1.4}
.topic .meta{margin-top:auto;padding-top:8px;font-size:.82rem;color:var(--accent);font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px;padding:0;margin:28px 0 0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:.95rem;line-height:1.45;color:var(--muted)}
.steps li::before{content:counter(s);flex:none;display:grid;place-items:center;width:2.1em;height:2.1em;border-radius:50%;box-shadow:var(--in-sm);color:var(--accent);font-weight:700;font-size:.85rem}
.bar{height:10px;border-radius:99px;box-shadow:var(--in-sm);overflow:hidden;margin:10px 0 24px;padding:2px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .3s}
.qmeta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.85rem;font-weight:500}
.qtext{font-size:1.14rem;line-height:1.45;letter-spacing:-.01em;margin:0 0 .8em}
pre{background:none;box-shadow:var(--in);border-radius:16px;padding:14px 16px;overflow-x:auto;font:13.5px/1.55 var(--mono);margin:.4em 0 1.2em}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:600;font-size:.82rem;color:var(--muted);margin-bottom:4px;padding:0}
.opt{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px 16px;margin:14px 0;cursor:pointer;box-shadow:var(--up-sm);transition:box-shadow .2s}
.opt:has(input:checked){box-shadow:var(--in)}
.opt.tried{box-shadow:none;color:var(--muted);text-decoration:line-through;cursor:not-allowed;opacity:.7}
.opt.right{box-shadow:var(--in),inset 0 0 0 2px var(--good);color:var(--good);text-decoration:none;opacity:1;font-weight:600}
.opt input{appearance:none;-webkit-appearance:none;flex:none;margin:0;width:20px;height:20px;border-radius:50%;box-shadow:var(--in-sm);cursor:inherit;transition:background .2s}
.opt input:checked{background:radial-gradient(circle,var(--accent) 0 42%,transparent 46%);box-shadow:var(--up-sm)}
.opt.right input{background:radial-gradient(circle,var(--good) 0 42%,transparent 46%)}
.opt span{font-family:var(--mono);font-size:.93rem;overflow-wrap:anywhere;min-width:0}
.opt.prose span{font-family:inherit;font-size:1rem}
.chips{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;margin:6px 0 4px;border-radius:99px;box-shadow:var(--in-sm)}
.chips label{border-radius:99px;padding:8px 16px;cursor:pointer;font-size:.9rem;font-weight:500;color:var(--muted);transition:color .2s,box-shadow .2s}
.chips label:has(input:checked){color:var(--accent);font-weight:600;box-shadow:var(--up-sm)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:14px;margin-top:22px;align-items:center}
button.btn{font:inherit;font-weight:600;font-size:.97rem;border-radius:99px;padding:12px 24px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:var(--up-sm);transition:box-shadow .2s,transform .1s,opacity .2s}
button.btn:active{transform:scale(.98)}
button.btn.ghost{background:var(--bg);color:var(--accent)}
button.btn.ghost:active{box-shadow:var(--in-sm)}
button.btn:disabled{background:var(--bg);color:var(--muted);box-shadow:var(--in-sm);cursor:not-allowed;transform:none}
.note{border-radius:16px;padding:14px 16px;margin:16px 0 0;font-size:.97rem;box-shadow:var(--in)}
.note b{display:block;margin-bottom:2px;font-size:.82rem;letter-spacing:.02em;text-transform:uppercase}
.note.good b{color:var(--good)}
.note.bad b{color:var(--bad)}
.note.hint b{color:var(--warn)}
.note.why b{color:var(--accent)}
.lock{color:var(--muted);font-size:.86rem;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin:22px 0}
.stat{border-radius:20px;padding:16px 18px;box-shadow:var(--up-sm)}
.stat b{display:block;font-size:1.9rem;line-height:1.1;letter-spacing:-.03em;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:4px}
.stat small{color:var(--muted);line-height:1.35;display:block}
.tablewrap{overflow-x:auto;padding:10px 16px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid color-mix(in srgb,var(--muted) 22%,transparent);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:.8rem;white-space:nowrap}
td.n,th.n{text-align:right}
textarea{width:100%;min-height:130px;font:13px/1.45 var(--mono);border:0;border-radius:18px;padding:14px 16px;background:var(--bg);color:var(--ink);box-shadow:var(--in);resize:vertical}
textarea::placeholder{color:var(--muted)}
.codebox{word-break:break-all;font:12px/1.45 var(--mono);box-shadow:var(--in);padding:14px 16px;border-radius:16px;max-height:110px;overflow:auto}
.muted{color:var(--muted)}
.kicker{color:var(--accent);font-weight:600;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin:0 0 .7em}
.fig{box-shadow:var(--in);border-radius:16px;padding:12px;margin:.4em 0 1.2em;overflow-x:auto;text-align:center}
.fig svg{max-width:100%;height:auto;display:inline-block}
.fig figcaption{font-size:.8rem;color:var(--muted);margin-top:2px}
.figs{display:flex;flex-wrap:wrap;gap:14px}
.figs .fig{flex:1 1 170px;margin:14px 0 0}
.fig .e{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .e.hi{stroke:var(--accent);stroke-width:3}
.fig .e.dim{opacity:.4;stroke-dasharray:4 4}
.fig .ah{fill:var(--muted)}
.fig .n{fill:var(--bg);stroke:var(--muted);stroke-width:1.6}
.fig .n.hi{stroke:var(--accent);stroke-width:3}
.fig .wb{fill:var(--bg)}
.fig text{fill:var(--ink);font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.fig text.w{fill:var(--muted);font-size:12px}
.field{display:block;margin:14px 0}
.field span{display:block;font-weight:600;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:inherit;border:0;border-radius:14px;padding:12px 16px;background:var(--bg);color:var(--ink);box-shadow:var(--in)}
.login{max-width:400px}
button.link{font:inherit;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline}
footer{margin-top:56px;color:var(--muted);font-size:.8rem;line-height:1.5;max-width:60ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:420px){nav button{padding:7px 9px;font-size:.83rem}.wrap{padding:18px 16px 56px}.card{padding:20px 18px}.tablewrap{padding:8px 12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.topic:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Think First home">Think <span>First</span></button>
    <nav aria-label="Main">
      <button data-nav="home">Practice</button>
      <button data-nav="report">My report</button>
      <button data-nav="teacher" hidden>Teacher</button>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>
    No name, email or roll number is collected. Each answer is sent anonymously to your teacher's class sheet so the class can see which topics need more time.
    <span id="tWrap"><br>Teaching this class? <button class="link" id="tLogin">Teacher sign in</button></span>
  </footer>
</div>

<script src="questions.js"></script>
<script>
"use strict";
/* ------------------------------------------------------------------
   Class collection. When formAction and formEntry are set, every question a
   student meets for the first time (and every second-chance result) is sent
   as one anonymous row to a Google Form, which feeds a private Google Sheet
   that only the teacher can open. Leave them empty to keep everything local.
------------------------------------------------------------------- */
const CONFIG = {
  formAction: "https://docs.google.com/forms/d/e/1FAIpQLSek5Z4IsITclyE_Xg0tEpt_apB8cjtG_Y7ra5uFCOBOcdWgww/formResponse",
  formEntry: "entry.294631717",
  sheetUrl: "https://docs.google.com/spreadsheets/d/1xaUirATIIYcNPqRssWLqPnehokzszKsy9f-EeLKLDb0/edit"
};
/* Teacher sign-in. This page has no server, so the check runs in the browser:
   it hides the Teacher view from students but is not strong security. Only a
   salted PBKDF2 hash of "id:password" is stored here, never the password.
   The class data itself is protected by Google Sheet sharing, not by this.  */
const TEACHER = { salt: "thinkfirst.teacher.v1", rounds: 150000, hash: "58bd952088a965f3ba39428fb6090c912b9c2dcdfb3964c92586130d7d3bb417" };
const TKEY = "thinkfirst.teacher";
const QUICK_GUESS_SECONDS = 4;
const KEY = "thinkfirst.v1";
const TOPICS = window.TF_TOPICS, QUESTIONS = window.TF_QUESTIONS;
const QBY = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "n/a";
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- storage (works without it, just forgets on reload) ---------- */
let mem = null;
function load() {
  if (mem) return mem;
  try { mem = JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { mem = null; }
  if (!mem || !mem.r) mem = { id: "s" + Math.random().toString(36).slice(2, 8), r: {} };
  if (!mem.t) mem.t = {};     // per topic: s = start row sent, f = finish row sent. mem.fb = feedback given
  return mem;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* private mode: keep in memory */ } }

/* A record is the FIRST time a student met a question:
   a = attempts, h = hints opened, v = solution shown (1/0), f = first try correct (1/0),
   g = quick guess (1/0), c = confidence on first try (2 sure, 1 unsure, 0 guess),
   x = second chance result (1 right, 0 wrong, -1 not taken)                         */
function summarise(records) {
  const rows = Object.values(records), n = rows.length;
  const own = rows.filter(r => r.f).length;
  const shown = rows.filter(r => r.v).length;
  const retried = rows.filter(r => r.x >= 0);
  return {
    n, own, shown, worked: n - own - shown,
    hints: rows.reduce((s, r) => s + r.h, 0),
    quick: rows.filter(r => r.g).length,
    over: rows.filter(r => r.c === 2 && !r.f).length,
    sure: rows.filter(r => r.c === 2).length,
    retried: retried.length, recovered: retried.filter(r => r.x === 1).length
  };
}
function makeCode() {
  const d = load();
  const r = Object.entries(d.r).map(([id, x]) => [id, x.a, x.h, x.v, x.f, x.g, x.c, x.x]);
  return "TF1." + btoa(JSON.stringify({ id: d.id, r }));
}
function readCodes(text) {
  const out = {};
  for (const m of text.match(/TF1\.[A-Za-z0-9+/=]+/g) || []) {
    try {
      const o = JSON.parse(atob(m.slice(4)));
      if (!o.id || !Array.isArray(o.r)) continue;
      const rec = {};
      for (const [id, a, h, v, f, g, c, x] of o.r) if (QBY[id]) rec[id] = { a, h, v, f, g, c, x };
      out[o.id] = rec;            // a later code from the same student replaces the earlier one
    } catch (e) { /* skip unreadable code */ }
  }
  return out;
}
function postRow(fields) {
  if (!CONFIG.formAction || !CONFIG.formEntry) return;
  try { const fd = new FormData(); fd.append(CONFIG.formEntry, fields.join("|")); fetch(CONFIG.formAction, { method: "POST", mode: "no-cors", body: fd }).catch(() => {}); } catch (e) { }
}
/* Topic events, sent once per student per topic so the sheet can show how many
   students who start a topic also finish it. Same 13-field shape as answer rows. */
function postEvent(kind, topic, n) {
  const d = load(), t = d.t[topic.id] || (d.t[topic.id] = {}), flag = kind === "start" ? "s" : "f";
  if (t[flag]) return;
  t[flag] = 1; save(); postRow([d.id, topic.name, "-", "-", kind, n, 0, 0, 0, 0, 0, 0, 0]);
}
const FEEDBACK = [[2, "It helped"], [1, "No difference"], [0, "It annoyed me"]];
const short = t => t.replace(/[|\n]/g, " ").slice(0, 90);

/* ---------- navigation ---------- */
function isTeacher() { try { return sessionStorage.getItem(TKEY) === "1"; } catch (e) { return teacherMem; } }
let teacherMem = false;
function setTeacher(on) {
  teacherMem = on;
  try { on ? sessionStorage.setItem(TKEY, "1") : sessionStorage.removeItem(TKEY); } catch (e) { }
  syncTeacherUi();
}
function syncTeacherUi() {
  const on = isTeacher() || teacherMem;
  $('nav [data-nav="teacher"]').hidden = !on; $("#tWrap").hidden = on;
}
async function checkLogin(id, pw) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(id.trim().toLowerCase() + ":" + pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(TEACHER.salt), iterations: TEACHER.rounds }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, "0")).join("") === TEACHER.hash;
}
function login() {
  app.innerHTML = `
    <h1>Teacher sign in</h1>
    <p class="lead">For teachers of this class. Students do not need to sign in.</p>
    <form class="card login" id="lf" novalidate>
      <label class="field"><span>Login ID</span><input id="lid" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="lpw" type="password" autocomplete="current-password" required></label>
      <div class="row"><button class="btn" id="lgo">Sign in</button><span id="lmsg" class="muted" role="alert"></span></div>
    </form>`;
  $("#lf").addEventListener("submit", async e => {
    e.preventDefault();
    const msg = $("#lmsg"), id = $("#lid").value, pw = $("#lpw").value;
    if (!id.trim() || !pw) { msg.textContent = "Enter both the login ID and the password."; return; }
    $("#lgo").disabled = true; msg.textContent = "Checking...";
    let ok = false;
    try { ok = await checkLogin(id, pw); } catch (err) { $("#lgo").disabled = false; msg.textContent = "This browser cannot check the sign in. Try a current version of Chrome, Edge, Safari or Firefox."; return; }
    if (ok) { setTeacher(true); go("teacher"); }
    else { $("#lgo").disabled = false; $("#lpw").value = ""; msg.textContent = "That login ID or password is not right."; }
  });
  $("#lid").focus();
}
function go(view, arg) {
  if (view === "teacher" && !(isTeacher() || teacherMem)) view = "login";
  document.querySelectorAll("nav button").forEach(b => b.dataset.nav === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  ({ home, report, teacher, login, session: startSession })[view](arg);
  app.focus({ preventScroll: true }); window.scrollTo(0, 0);
}
document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => go(b.dataset.nav)));
$("#homeBtn").addEventListener("click", () => go("home"));
$("#tLogin").addEventListener("click", () => go("login"));
syncTeacherUi();

/* ---------- diagrams (inline SVG drawn from data in questions.js) ---------- */
function figSvg(f) {
  let W = 0, H = 0, s = "";
  if (f.type === "tree") {
    const nodes = [], edges = []; let k = 0, maxd = 0;
    (function walk(t, d, parent) {
      if (!t) return;
      const me = { label: t[0], d }; maxd = Math.max(maxd, d);
      walk(t[1], d + 1, me); me.i = k++; nodes.push(me); walk(t[2], d + 1, me);
      if (parent) edges.push([parent, me]);
    })(f.root, 0, null);
    const step = Math.min(46, 300 / Math.max(1, k - 1)), r = f.small ? 8 : 15, hi = f.hi || [];
    const X = n => 22 + n.i * step, Y = n => 22 + n.d * 50;
    W = 44 + (k - 1) * step; H = 44 + maxd * 50;
    s += edges.map(([a, b]) => `<line class="e" x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}"/>`).join("");
    s += nodes.map(n => `<circle class="n${hi.includes(n.label) ? " hi" : ""}" cx="${X(n)}" cy="${Y(n)}" r="${r}"/>${n.label === "" ? "" : `<text x="${X(n)}" y="${Y(n)}">${esc(n.label)}</text>`}`).join("");
  } else if (f.type === "graph") {
    W = f.w; H = f.h; const hi = f.hi;
    s += f.edges.map(([a, b, w]) => {
      const [x1, y1] = f.nodes[a], [x2, y2] = f.nodes[b], mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const cls = hi ? (hi.includes(a + "-" + b) ? " hi" : " dim") : "";
      return `<line class="e${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>` + (w === undefined ? "" : `<rect class="wb" x="${mx - 10}" y="${my - 9}" width="20" height="18" rx="6"/><text class="w" x="${mx}" y="${my}">${esc(w)}</text>`);
    }).join("");
    s += Object.entries(f.nodes).map(([id, [x, y]]) => `<circle class="n" cx="${x}" cy="${y}" r="15"/><text x="${x}" y="${y}">${esc(id)}</text>`).join("");
  } else if (f.type === "list") {
    const n = f.items.length, bx = i => 12 + i * 90, by = 26;
    W = 12 + n * 90 + (f.circular ? -22 : 36); H = f.circular ? 98 : 72;
    s += `<text class="w" x="${bx(0) + 28}" y="12">head</text>`;
    f.items.forEach((v, i) => {
      s += `<rect class="n" x="${bx(i)}" y="${by}" width="56" height="34" rx="10"/><text x="${bx(i) + 28}" y="${by + 17}">${esc(v)}</text>`;
      if (i < n - 1 || !f.circular) { const x1 = bx(i) + 56, x2 = bx(i) + 90; s += `<line class="e" x1="${x1}" y1="${by + 17}" x2="${x2 - 7}" y2="${by + 17}"/><path class="ah" d="M${x2 - 1} ${by + 17}l-9 -5v10z"/>`; }
    });
    if (f.circular) { const xl = bx(n - 1) + 28, xf = bx(0) + 28, yb = by + 34; s += `<path class="e" d="M${xl} ${yb}v14q0 10 -10 10H${xf + 10}q-10 0 -10 -10v-7"/><path class="ah" d="M${xf} ${yb + 1}l-5 9h10z"/>`; }
    else s += `<text class="w" x="${bx(n) + 18}" y="${by + 17}">NULL</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" focusable="false">${s}</svg>`;
}
function figHtml(figs) {
  if (!figs) return "";
  const list = Array.isArray(figs) ? figs : [figs];
  const one = f => `<figure class="fig" role="img" aria-label="${esc(f.alt)}">${figSvg(f)}${f.cap ? `<figcaption>${esc(f.cap)}</figcaption>` : ""}</figure>`;
  return list.length > 1 ? `<div class="figs">${list.map(one).join("")}</div>` : one(list[0]);
}

/* ---------- home ---------- */
function home() {
  const d = load();
  const cards = TOPICS.map(t => {
    const qs = QUESTIONS.filter(q => q.topic === t.id), done = qs.filter(q => d.r[q.id]);
    const own = done.filter(q => d.r[q.id].f).length;
    const meta = done.length ? `${done.length} of ${qs.length} done, ${own} on first try` : `${qs.length} questions`;
    return `<button class="card topic" data-topic="${t.id}"><b>${esc(t.name)}</b><small>${esc(t.blurb)}</small><span class="meta">${meta}</span></button>`;
  }).join("");
  app.innerHTML = `
    <p class="kicker">Data Structures · B.E. third semester</p>
    <h1>Answer first. Help comes after.</h1>
    <p class="lead">Practice questions for Data Structures. Pick an answer. If you get it wrong, you get a hint and try again. After a few tries you see the full solution.</p>
    <ol class="steps" aria-label="How it works">
      <li>Pick an answer and say how sure you are.</li>
      <li>Wrong? Try again. Each try unlocks one hint.</li>
      <li>Missed questions come back once at the end.</li>
    </ol>
    <h2>Pick a topic</h2>
    <div class="grid">${cards}</div>`;
  app.querySelectorAll("[data-topic]").forEach(b => b.addEventListener("click", () => go("session", b.dataset.topic)));
}

/* ---------- session ---------- */
let S = null;
function startSession(topicId) {
  const qs = shuffle(QUESTIONS.filter(q => q.topic === topicId));
  S = { topic: TOPICS.find(t => t.id === topicId), queue: qs, i: 0, phase: "main", results: [], retry: [] };
  postEvent("start", S.topic, qs.length);
  showQuestion();
}
function showQuestion() {
  const q = S.queue[S.i], second = S.phase === "second";
  const order = shuffle(q.options.map((_, i) => i));
  const st = { tried: new Set(), attempts: 0, hints: 0, shown: false, done: false, t0: Date.now(), conf: null, quick: 0, first: null };
  const prose = q.options.some(o => o.length > 28);
  app.innerHTML = `
    <div class="qmeta"><span>${esc(S.topic.name)}${second ? " · second chance" : ""}</span><span>Question ${S.i + 1} of ${S.queue.length}</span></div>
    <div class="bar"><i style="width:${100 * S.i / S.queue.length}%"></i></div>
    <div class="card">
      <p class="qtext">${esc(q.q)}</p>
      ${q.code ? `<pre>${esc(q.code)}</pre>` : ""}
      ${figHtml(q.fig)}
      <form id="f" novalidate>
        <fieldset id="opts"><legend>Your answer</legend>
          ${order.map(i => `<label class="opt${prose ? " prose" : ""}" data-i="${i}"><input type="radio" name="o" value="${i}"><span>${esc(q.options[i])}</span></label>`).join("")}
        </fieldset>
        ${second ? "" : `<fieldset id="conf" style="margin-top:12px"><legend>How sure are you?</legend>
          <div class="chips">
            <label><input type="radio" name="c" value="2">Sure</label>
            <label><input type="radio" name="c" value="1">Not sure</label>
            <label><input type="radio" name="c" value="0">Guessing</label>
          </div></fieldset>`}
        <div class="row">
          <button class="btn" id="commit" disabled>Commit answer</button>
          <button class="btn ghost" type="button" id="hintBtn" hidden></button>
          <button class="btn ghost" type="button" id="giveBtn" hidden>Show the solution</button>
        </div>
        <p class="lock" id="lock">${second ? "One try this time. No hints." : "Hints and the solution stay locked until you commit an answer."}</p>
      </form>
      <div id="fb" aria-live="polite"></div>
    </div>`;
  const f = $("#f"), commit = $("#commit"), fb = $("#fb"), hintBtn = $("#hintBtn"), giveBtn = $("#giveBtn"), lock = $("#lock");
  const ready = () => { commit.disabled = st.done || !f.o.value || (!second && st.attempts === 0 && !f.c.value); };
  f.addEventListener("change", ready);
  const note = (cls, title, text, extra = "") => { fb.insertAdjacentHTML("beforeend", `<div class="note ${cls}"><b>${esc(title)}</b>${esc(text)}${extra}</div>`); };
  const showWhy = title => note("why", title, q.why, figHtml(q.whyFig));
  const finish = () => {
    st.done = true; commit.hidden = true; hintBtn.hidden = true; giveBtn.hidden = true; lock.hidden = true;
    f.querySelectorAll("input").forEach(x => x.disabled = true);
    $(`.opt[data-i="${q.answer}"]`).classList.add("right");
    if (second) { const rec = load().r[q.id]; if (rec && rec.x === -1) { rec.x = st.first ? 1 : 0; save(); postRow([load().id, S.topic.name, q.id, short(q.q), "second", 0, 0, 0, 0, 0, 0, rec.x, 0]); } S.results.push({ id: q.id, second: true, ok: st.first }); }
    else {
      const d = load();
      if (!d.r[q.id]) { const r = d.r[q.id] = { a: st.attempts, h: st.hints, v: st.shown ? 1 : 0, f: st.first ? 1 : 0, g: st.quick, c: st.conf, x: -1 }; save(); postRow([d.id, S.topic.name, q.id, short(q.q), "first", r.a, r.h, r.v, r.f, r.g, r.c, r.f, (r.c === 2 && !r.f) ? 1 : 0]); }
      S.results.push({ id: q.id, first: st.first, shown: st.shown });
      if (!st.first) S.retry.push(q);
    }
    const last = S.i === S.queue.length - 1;
    fb.insertAdjacentHTML("beforeend", `<div class="row"><button class="btn" id="next">${last ? (S.phase === "main" && S.retry.length ? "Go to second chance" : "See my result") : "Next question"}</button></div>`);
    $("#next").addEventListener("click", next); $("#next").focus();
  };
  const reveal = () => { st.shown = true; showWhy("Solution"); finish(); };
  hintBtn.addEventListener("click", () => { st.hints++; note("hint", "Hint " + st.hints, st.hints === 1 ? q.h1 : q.h2); updateUnlocks(); });
  giveBtn.addEventListener("click", reveal);
  function updateUnlocks() {
    if (second || st.done) return;
    const available = Math.min(st.attempts, 2);
    hintBtn.hidden = st.hints >= available; hintBtn.textContent = "Show hint " + (st.hints + 1);
    giveBtn.hidden = st.attempts < 2;
    lock.textContent = st.attempts === 0 ? "Hints and the solution stay locked until you commit an answer."
      : st.attempts === 1 ? "Hint 1 is unlocked. Try again to unlock hint 2."
      : "Both hints are unlocked. Try once more, or open the solution.";
  }
  f.addEventListener("submit", e => {
    e.preventDefault(); if (commit.disabled) return;
    const pick = Number(f.o.value), ok = pick === q.answer;
    st.attempts++;
    if (st.attempts === 1) { st.first = ok; if (!second) { st.conf = Number(f.c.value); st.quick = (Date.now() - st.t0) / 1000 < QUICK_GUESS_SECONDS ? 1 : 0; $("#conf").hidden = true; } }
    if (ok) {
      note("good", st.attempts === 1 ? "Correct on the first try." : "Correct.", ""); showWhy("Why"); finish(); return;
    }
    st.tried.add(pick);
    const lab = $(`.opt[data-i="${pick}"]`); lab.classList.add("tried"); lab.querySelector("input").disabled = true; lab.querySelector("input").checked = false;
    if (second) { note("bad", "Not this time.", ""); showWhy("Solution"); finish(); return; }
    if (st.attempts >= 3) { note("bad", "Not yet.", "That was your third try, so here is the full solution."); reveal(); return; }
    note("bad", "Not yet.", st.attempts === 1 ? "That option is ruled out. You can open hint 1 or try again." : "Two options are ruled out. Hint 2 is now unlocked.");
    updateUnlocks(); ready();
  });
}
function next() {
  if (S.i < S.queue.length - 1) { S.i++; return showQuestion(); }
  if (S.phase === "main" && S.retry.length) { S.phase = "second"; S.queue = shuffle(S.retry); S.i = 0; return showQuestion(); }
  sessionEnd();
}
function sessionEnd() {
  const main = S.results.filter(r => !r.second), sec = S.results.filter(r => r.second);
  const own = main.filter(r => r.first).length, shown = main.filter(r => r.shown).length;
  const worked = main.length - own - shown, rec = sec.filter(r => r.ok).length;
  postEvent("finish", S.topic, main.length);
  const askFb = load().fb === undefined;
  const line = shown === 0 ? "You never needed the solution in this topic."
    : `You needed the solution for ${shown} of ${main.length} questions.`;
  app.innerHTML = `
    <h1>${esc(S.topic.name)}: done</h1>
    <p class="lead">${line}${sec.length ? ` On the second chance you got ${rec} of ${sec.length} right.` : ""}</p>
    <div class="stats">
      <div class="stat"><b>${own}/${main.length}</b><small>right on the first try</small></div>
      <div class="stat"><b>${worked}</b><small>solved after a hint or retry</small></div>
      <div class="stat"><b>${shown}</b><small>needed the solution</small></div>
      ${sec.length ? `<div class="stat"><b>${rec}/${sec.length}</b><small>recovered on second chance</small></div>` : ""}
    </div>
    ${askFb ? `<div class="card" id="fbCard" style="margin:8px 0 6px"><fieldset><legend>One quick question (optional, no name attached)</legend>
      <p style="margin:.2em 0 .6em">You had to answer before the solution opened. How was that?</p>
      <div class="row" style="margin-top:0">${FEEDBACK.map(([v, label]) => `<button class="btn ghost" type="button" data-fb="${v}">${label}</button>`).join("")}</div>
    </fieldset></div>` : ""}
    <div class="row"><button class="btn" id="more">Another topic</button><button class="btn ghost" id="rep">My report</button></div>`;
  app.querySelectorAll("[data-fb]").forEach(b => b.addEventListener("click", () => {
    const d = load(); if (d.fb !== undefined) return;
    d.fb = Number(b.dataset.fb); save();
    postRow([d.id, S.topic.name, "-", b.textContent, "feedback", d.fb, 0, 0, 0, 0, 0, 0, 0]);
    $("#fbCard").innerHTML = `<p class="muted" style="margin:0" role="status">Thanks. That was sent without your name.</p>`;
  }));
  $("#more").addEventListener("click", () => go("home")); $("#rep").addEventListener("click", () => go("report"));
}

/* ---------- shared stats block ---------- */
function statsBlock(s) {
  return `<div class="stats">
    <div class="stat"><b>${pct(s.n - s.shown, s.n)}</b><small>think-first score: solved without the solution</small></div>
    <div class="stat"><b>${pct(s.own, s.n)}</b><small>right on the first try</small></div>
    <div class="stat"><b>${s.n ? (s.hints / s.n).toFixed(1) : "n/a"}</b><small>hints opened per question</small></div>
    <div class="stat"><b>${pct(s.recovered, s.retried)}</b><small>missed questions recovered on second chance</small></div>
    <div class="stat"><b>${pct(s.over, s.sure)}</b><small>"sure" answers that were wrong</small></div>
    <div class="stat"><b>${pct(s.quick, s.n)}</b><small>answered in under ${QUICK_GUESS_SECONDS} seconds</small></div>
  </div>`;
}

/* ---------- my report ---------- */
function report() {
  const d = load(), s = summarise(d.r);
  if (!s.n) { app.innerHTML = `<h1>My report</h1><p class="lead">Nothing yet. Finish a topic and your numbers appear here.</p><div class="row"><button class="btn" id="b">Start practising</button></div>`; $("#b").addEventListener("click", () => go("home")); return; }
  const rows = TOPICS.map(t => {
    const rec = {}; QUESTIONS.filter(q => q.topic === t.id && d.r[q.id]).forEach(q => rec[q.id] = d.r[q.id]);
    const x = summarise(rec); if (!x.n) return "";
    return `<tr><td>${esc(t.name)}</td><td class="n">${x.n}</td><td class="n">${x.own}</td><td class="n">${x.worked}</td><td class="n">${x.shown}</td></tr>`;
  }).join("");
  app.innerHTML = `
    <h1>My report</h1>
    <p class="lead">Counted from the first time you met each question (${s.n} of ${QUESTIONS.length} so far).</p>
    ${statsBlock(s)}
    <div class="card tablewrap"><table>
      <thead><tr><th>Topic</th><th class="n">Done</th><th class="n">First try</th><th class="n">After hints</th><th class="n">Needed solution</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <h2>Share with your teacher</h2>
    <p class="muted">This code holds your results only. It has no name in it. Copy it and send it to your teacher.</p>
    <div class="codebox" id="code">${esc(makeCode())}</div>
    <div class="row"><button class="btn" id="copy">Copy my results code</button><button class="btn ghost" id="reset">Clear my results</button><span id="msg" class="muted" aria-live="polite"></span></div>`;
  $("#copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(makeCode()); $("#msg").textContent = "Copied."; }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("#code")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("#msg").textContent = "Code selected. Copy it manually."; }
  });
  let armed = false;
  $("#reset").addEventListener("click", e => {
    if (!armed) { armed = true; e.target.textContent = "Tap again to clear everything"; return; }
    mem = { id: load().id, r: {}, t: load().t, fb: load().fb }; save(); report();
  });
}

/* ---------- teacher ---------- */
let classData = {};
function teacher() {
  app.innerHTML = `
    <h1>Teacher view</h1>
    ${CONFIG.sheetUrl ? `<p class="lead">Class results arrive automatically in a private sheet. <a href="${CONFIG.sheetUrl}" target="_blank" rel="noopener">Open the class sheet</a> (only people the owner has shared it with can open it).</p><h2>Check individual codes</h2>` : ""}
    <p class="lead">Ask students to send their results code from "My report". Paste all the codes below, in any order and with any text around them. Nothing is uploaded: the numbers are worked out in this browser.</p>
    <textarea id="codes" aria-label="Paste student results codes" placeholder="Paste results codes here (they start with TF1.)"></textarea>
    <div class="row"><button class="btn" id="add">Add codes</button><button class="btn ghost" id="mine">Add this device's results</button><button class="btn ghost" id="clear">Clear class</button><button class="btn ghost" id="out2">Sign out</button></div>
    <div id="out"></div>`;
  $("#add").addEventListener("click", () => { Object.assign(classData, readCodes($("#codes").value)); $("#codes").value = ""; renderClass(); });
  $("#mine").addEventListener("click", () => { Object.assign(classData, readCodes(makeCode())); renderClass(); });
  $("#clear").addEventListener("click", () => { classData = {}; renderClass(); });
  $("#out2").addEventListener("click", () => { setTeacher(false); classData = {}; go("home"); });
  renderClass();
}
function renderClass() {
  const out = $("#out"), students = Object.values(classData).filter(r => Object.keys(r).length);
  if (!students.length) { out.innerHTML = `<p class="muted" style="margin-top:14px">No student results added yet.</p>`; return; }
  const all = {}; let k = 0;
  students.forEach(r => Object.entries(r).forEach(([id, x]) => all[id + "#" + (k++)] = x));
  const s = summarise(all);
  const perQ = QUESTIONS.map(q => {
    const rs = students.map(r => r[q.id]).filter(Boolean); if (!rs.length) return null;
    return { q, n: rs.length, own: rs.filter(r => r.f).length, shown: rs.filter(r => r.v).length, over: rs.filter(r => r.c === 2 && !r.f).length };
  }).filter(Boolean).sort((a, b) => b.shown / b.n - a.shown / a.n || a.own / a.n - b.own / b.n);
  const tname = id => TOPICS.find(t => t.id === id).name;
  out.innerHTML = `
    <h2>Class summary: ${students.length} student${students.length > 1 ? "s" : ""}, ${s.n} first attempts</h2>
    ${statsBlock(s)}
    <h2>Questions, hardest first</h2>
    <div class="card tablewrap"><table>
      <thead><tr><th>Question</th><th>Topic</th><th class="n">Students</th><th class="n">First try</th><th class="n">Needed solution</th><th class="n">Sure but wrong</th></tr></thead>
      <tbody>${perQ.map(r => `<tr><td>${esc(r.q.q.length > 90 ? r.q.q.slice(0, 88) + "..." : r.q.q)}</td><td>${esc(tname(r.q.topic))}</td><td class="n">${r.n}</td><td class="n">${pct(r.own, r.n)}</td><td class="n">${pct(r.shown, r.n)}</td><td class="n">${r.over}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="muted">"Sure but wrong" points to a shared misconception, which is usually worth five minutes in class.</p>`;
}

go("home");
</script>
</body>
</html>
